# 本地开发用 Postgres
# 启动：docker compose up -d
# 关闭：docker compose down
# 清空数据：docker compose down -v

services:
  db:
    image: postgres:16-alpine
    container_name: nuanyu-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nuanyu
      POSTGRES_PASSWORD: nuanyu_dev
      POSTGRES_DB: nuanyu_analytics
      TZ: Asia/Shanghai
    ports:
      - '5433:5432'   # 用 5433 避免和本机已有 Postgres 冲突
    volumes:
      - nuanyu_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nuanyu -d nuanyu_analytics']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  nuanyu_pgdata:

name: nuanyu-analytics
